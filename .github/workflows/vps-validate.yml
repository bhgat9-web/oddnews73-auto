name: ODD News 73 - VPS Deployment Validation

on:
  push:
    branches: [main]
    paths:
      - 'vps/**'
      - '.github/workflows/vps-pages.yml'
      - '.github/workflows/vps-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check deployment script and publisher syntax
        run: |
          bash -n vps/install.sh vps/activate.sh vps/install-producer.sh
          python -m py_compile vps/runner.py vps/producer.py
      - name: Install existing publisher dependencies
        run: pip install -r requirements.txt
      - name: Verify existing editorial and publisher safeguards
        run: python -m unittest discover -s tests -v
      - name: Validate timer slot count
        run: |
          python - <<'PY'
          from pathlib import Path
          timer = Path("vps/oddnews73-publisher.timer").read_text()
          assert timer.count("OnCalendar=") == 18
          assert "Persistent=false" in timer
          service = Path("vps/oddnews73-publisher.service").read_text()
          assert "User=oddnews73" in service
          assert "ProtectSystem=strict" in service
          producer_timer = Path("vps/oddnews73-producer.timer").read_text()
          assert producer_timer.count("OnCalendar=") == 3
          assert "Unit=oddnews73-producer.service" in producer_timer
          producer_service = Path("vps/oddnews73-producer.service").read_text()
          assert "User=oddnews73" in producer_service
          assert "ProtectSystem=strict" in producer_service
          assert "producer.py run" in producer_service
          print("VPS deployment syntax, timer slots, and service isolation verified.")
          PY
