name: ODD News 73 - Automatic Instagram Publishing

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'queue/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/oddnews73.yml'
  schedule:
    # UTC: 09:07/09:27, 14:07/14:27, 21:07/21:27 IST.
    - cron: '37,57 3,8,15 * * *'
    # Final backup at 09:47, 14:47 and 21:47 IST, in the same guarded slots.
    # Late starts are accepted for up to three hours, ending at local midnight.
    - cron: '17 4,9,16 * * *'
  workflow_dispatch:
    inputs:
      demo_mode:
        description: 'Generate a clearly marked fictional design demo; never publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oddnews73-state-writer
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prepared: ${{ steps.detect.outputs.prepared }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run the offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Load one prepared post without AI API calls
        env:
          LIVE_PUBLISH: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          AUTO_PUBLISH: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          STRICT_SCHEDULE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          if [ "${{ inputs.demo_mode }}" = "true" ]; then
            python src/oddnews73.py prepare --demo
          else
            python src/oddnews73.py prepare-queued
          fi
      - name: Was a post prepared?
        id: detect
        run: |
          if [ -f run.json ]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Report skipped or missed scheduled slots accurately
        if: github.event_name == 'schedule' && steps.detect.outputs.prepared != 'true'
        env:
          SLOT_STATUS_FILE: schedule_result.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          path = Path(os.environ["SLOT_STATUS_FILE"])
          outcome = json.loads(path.read_text()) if path.exists() else {}
          status = outcome.get("status", "unknown")
          slot = outcome.get("slot", "unknown")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### ODD News 73 scheduled slot: {slot}\n\n")
              summary.write(f"**Outcome:** {status}\n")
          if status == "already_posted":
              print("BACKUP RUN SUCCESS: this slot already has a published post.")
              sys.exit(0)
          print("POST NOT PUBLISHED: no valid candidate prepared.")
          print("Reason:", status)
          print("Slot:", slot)
          sys.exit(1)
          PY

      - name: Persist draft and history
        if: steps.detect.outputs.prepared == 'true'
        run: |
          git config user.name "oddnews73-bot"
          git config user.email "oddnews73-bot@users.noreply.github.com"
          git add state.json site/
          git diff --cached --quiet || (git commit -m "ODD News 73: prepare draft" && git push)
      - uses: actions/configure-pages@v5
        if: steps.detect.outputs.prepared == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.detect.outputs.prepared == 'true'
        with:
          path: site
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.prepared == 'true'
        with:
          name: current-post
          path: run.json
          retention-days: 1

  deploy:
    needs: prepare
    if: needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    outputs:
      page_url: ${{ steps.release.outputs.page_url }}
    steps:
      - name: Deploy public graphics and source index
        id: release
        uses: actions/deploy-pages@v4

  publish:
    needs: [prepare, deploy]
    if: github.event_name == 'schedule' && needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    env:
      LIVE_PUBLISH: 'true'
      AUTO_PUBLISH: 'true'
      IG_API_HOST: graph.facebook.com
      IG_API_VERSION: v27.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: current-post
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check exact published JPEG and Instagram account
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python src/oddnews73.py preflight --site-url "https://bhgat9-web.github.io/oddnews73-auto/"
      - name: Persist in-flight marker before publishing
        run: |
          git config user.name "oddnews73-bot"
          git config user.email "oddnews73-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "ODD News 73: automatic post in flight" && git push)
      - name: Publish one new post
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python src/oddnews73.py publish
      - name: Save outcome even when publication fails
        if: always()
        run: |
          git config user.name "oddnews73-bot"
          git config user.email "oddnews73-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "ODD News 73: automatic publish result" && git push)
