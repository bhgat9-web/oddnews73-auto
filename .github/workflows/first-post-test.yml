name: ODD News 73 - Supervised One-Time First Post

on:
  workflow_dispatch:
    inputs:
      approved_slug:
        description: 'Exact 16-character slug shown with the reviewed draft'
        required: true
        type: string
      approval_digest:
        description: 'Exact 64-character digest shown with the reviewed caption and JPEG'
        required: true
        type: string
      confirmation:
        description: 'Type exactly: PUBLISH @oddnews73'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: oddnews73-state-writer
  cancel-in-progress: false

jobs:
  supervised-first-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -v
      - name: Require the exact account confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = 'PUBLISH @oddnews73'
      - name: Bind approval to the exact draft, caption, source, and JPEG
        env:
          LIVE_PUBLISH: 'true'
          APPROVED_SLUG: ${{ inputs.approved_slug }}
          APPROVAL_DIGEST: ${{ inputs.approval_digest }}
        run: >-
          python src/oddnews73.py approve
          --slug "$APPROVED_SLUG"
          --approval-digest "$APPROVAL_DIGEST"
      - name: Read-only preflight for exact public JPEG and @oddnews73
        env:
          LIVE_PUBLISH: 'true'
          IG_API_HOST: graph.instagram.com
          IG_API_VERSION: v27.0
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: >-
          python src/oddnews73.py preflight
          --site-url "https://bhgat9-web.github.io/oddnews73-auto/"
      - name: Commit in-flight state before Meta's media_publish call
        run: |
          git config user.name "oddnews73-bot"
          git config user.email "oddnews73-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "ODD News 73: supervised post in flight" && git push)
      - name: Publish the one approved post through Meta's official API
        env:
          LIVE_PUBLISH: 'true'
          IG_API_HOST: graph.instagram.com
          IG_API_VERSION: v27.0
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python src/oddnews73.py publish
      - name: Save the verified outcome; ambiguous results require review
        if: always()
        run: |
          git config user.name "oddnews73-bot"
          git config user.email "oddnews73-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "ODD News 73: supervised publish result" && git push)

