name: ODD News 73 - Preview Real Story

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Generate a real-story draft without publishing
    runs-on: ubuntu-latest
    env:
      LIVE_PUBLISH: 'false'
      AUTO_PUBLISH: 'false'
      GEMINI_MODEL: gemini-3.5-flash-lite
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free dependencies
        run: pip install -r requirements.txt
      - name: Run editorial and publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Research and draft one actual story
        run: python src/oddnews73.py prepare
      - name: Inspect draft without contacting Instagram
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run = Path("run.json")
          if not run.exists():
              print("No publishable story was selected, or the AI caption did not meet quality checks.")
              raise SystemExit(1)
          slug = json.loads(run.read_text())["slug"]
          record = json.loads(Path("site/posts", slug + ".json").read_text())
          assert record["status"] == "draft", "Safety stop: this should only prepare a draft."
          assert not record["demo"], "Safety stop: not a real story."
          print("DRAFT ONLY — NO INSTAGRAM POST WILL BE MADE")
          print("Title:", record["title"])
          print("Source:", record["source"], record["source_url"])
          print("Caption:")
          print(record["caption"])
          print("Graphic: site/posts/" + slug + ".jpg")
          PY
      - name: Attach preview files to workflow
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: oddnews73-real-story-preview
          path: |
            site/posts/*.jpg
            site/posts/*.json
          retention-days: 7
