name: ODD News 73 - Preview Real Story

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Generate a real-story draft without publishing
    runs-on: ubuntu-latest
    env:
      LIVE_PUBLISH: 'false'
      AUTO_PUBLISH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free dependencies
        run: pip install -r requirements.txt
      - name: Run editorial and publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Preview the next prepared queue item
        shell: bash
        run: |
          set -o pipefail
          python -u src/oddnews73.py prepare-queued 2>&1 | tee preview-diagnostics.log
      - name: Inspect draft without contacting Instagram
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run = Path("run.json")
          if not run.exists():
              print("PREVIEW NOT CREATED: inspect preview-diagnostics.log or the Research step above.")
              print("The prepared queue is empty, already used, expired, or invalid. Prepare another batch in ChatGPT.")
              raise SystemExit(1)
          slug = json.loads(run.read_text())["slug"]
          record = json.loads(Path("site/posts", slug + ".json").read_text())
          assert record["status"] == "draft", "Safety stop: this should only prepare a draft."
          assert not record["demo"], "Safety stop: not a real story."
          print("DRAFT ONLY — NO INSTAGRAM POST WILL BE MADE")
          print("Title:", record["title"])
          print("Source:", record["source"], record["source_url"])
          print("Caption:")
          print(record["caption"])
          print("Graphic: site/posts/" + slug + ".jpg")
          PY
      - name: Attach diagnostics and any generated preview
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddnews73-preview-and-diagnostics
          if-no-files-found: warn
          path: |
            preview-diagnostics.log
            site/posts/*.jpg
            site/posts/*.json
          retention-days: 1
